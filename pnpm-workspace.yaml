packages:
  - "apps/*"
  - "packages/*"

# Only packages listed here may run install scripts (pnpm supply-chain default).
strictDepBuilds: true
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false

# better-auth ships unused DB adapters (incl. Prisma); we use Drizzle + Neon only.
autoInstallPeers: false
ignoredOptionalDependencies:
  - prisma
  - "@prisma/client"

# Central dependency versions — reference in package.json as "catalog:" (pnpm catalog protocol).
# Bump versions here once; run `pnpm install` across the monorepo.
catalog:
  # Framework
  next: 16.4.3
  react: 19.3.1
  react-dom: 19.3.1

  # Language & tooling
  typescript: ~6.0.3
  esbuild: 0.28.2
  tsx: ^4.23.15
  turbo: ^2.11.10
  "@turbo/gen": ^2.11.10

  # Types
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/mdx": ^2.0.14

  # Validation & ORM
  zod: ^4.6.7
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  "@neondatabase/serverless": ^1.2.0

  # Auth
  better-auth: ^1.7.14
  "@better-auth/api-key": 1.7.14
  "@better-auth/agent-auth": 0.6.2

  # Lint & format
  eslint: ^10.13.0
  "@eslint/js": ^10.0.1
  "@next/eslint-plugin-next": ^16.4.3
  typescript-eslint: ^8.72.1
  "@typescript-eslint/eslint-plugin": ^8.72.1
  "@typescript-eslint/parser": ^8.72.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-only-warn: ^1.2.1
  "@eslint-react/eslint-plugin": ^5.28.8
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-turbo: ^2.11.10
  globals: ^17.13.0
  prettier: ^3.9.10
  prettier-plugin-tailwindcss: ^0.8.1

  # Tailwind & CSS
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  postcss: ^8.5.32
  tailwind-merge: ^3.7.0
  tw-animate-css: ^1.4.0

  # UI
  "@phosphor-icons/react": ^2.1.10
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  cmdk: ^1.1.1
  next-themes: ^0.4.6
  radix-ui: ^1.8.1
  shadcn: ^4.23.0
  shiki: ^4.5.0
  sonner: ^2.0.8

  # Next.js utilities
  server-only: ^0.0.1

  # Payments
  stripe: ^23.1.0
  "@stripe/react-stripe-js": ^7.0.1
  "@stripe/stripe-js": ^10.2.0

  # Email
  resend: ^6.35.0
  react-email: ^6.11.6

  # Platform & storage
  "@upstash/redis": ^1.40.0
  "@vercel/sdk": ^1.28.54
  aws4fetch: ^1.0.20

  # API client & MCP
  openapi-fetch: ^0.17.0
  openapi-typescript: ^7.13.0
  mcp-handler: ^2.3.0
  "@modelcontextprotocol/server": ^2.4.0

  # Docs (Fumadocs)
  fumadocs-core: 16.17.9
  fumadocs-mdx: 15.4.10
  fumadocs-openapi: ^12.5.6
  fumadocs-ui: 16.17.9

  # Test
  vitest: ^5.0.5
  jsdom: ^30.1.3
  "@testing-library/dom": ^10.4.1
  "@testing-library/react": ^16.3.3
  vite: ^8.3.5

# Single versions across the tree (direct + transitive).
overrides:
  react: "catalog:"
  react-dom: "catalog:"
  esbuild: "catalog:"
